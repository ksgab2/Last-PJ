<div class="min-h-screen p-4 sm:p-8 md:p-10 selection:bg-archive-craft selection:text-archive-dark">
    <div class="mb-8 text-center sm:text-left">
        <span class="font-mono text-xs text-archive-terracotta uppercase tracking-widest block mb-1">05. ATTIC SHELVES</span>
        <h2 class="text-2xl sm:text-3xl font-serif font-bold text-archive-paper">취향의 서가</h2>
        <p class="text-xs sm:text-sm text-archive-craft mt-1 font-light">다락방 서가에 정갈하게 보관된 다른 아카이브 인덱스 카드를 감상합니다.</p>
    </div>

    <div class="flex justify-center sm:justify-start space-x-2 mb-6 font-mono text-xs">
        <button onclick="filterArchive('all', event)" class="archive-filter-btn px-3 py-1 bg-archive-paper text-archive-dark font-bold">ALL</button>
        <button onclick="filterArchive('lia', event)" class="archive-filter-btn px-3 py-1 border border-archive-craft/40 text-archive-craft hover:text-white">LIA</button>
        <button onclick="filterArchive('ol', event)" class="archive-filter-btn px-3 py-1 border border-archive-craft/40 text-archive-craft hover:text-white">OL</button>
        <button onclick="filterArchive('let', event)" class="archive-filter-btn px-3 py-1 border border-archive-craft/40 text-archive-craft hover:text-white">LET</button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-10" id="archive-grid"></div>
</div>

<!-- 아카이브 상세 모달 -->
<div id="archive-modal" class="fixed inset-0 bg-black/80 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="torn-paper torn-edge-top-bottom max-w-lg w-full p-6 sm:p-8 relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-archive-dark hover:text-archive-terracotta text-lg font-mono">[×]</button>
        <div class="tape-strip w-20 -top-2 left-6 rotate-[-1deg]"></div>

        <div class="flex items-center space-x-2 mb-4 pt-2 font-mono text-[10px]">
            <span id="modal-badge" class="px-2 py-0.5 bg-archive-dark text-archive-paper uppercase font-bold">—</span>
            <span id="modal-date" class="text-archive-muted">—</span>
        </div>

        <div class="contact-sheet p-2 mb-4 rounded-xs">
            <img id="modal-img" src="" class="w-full h-52 object-cover">
        </div>

        <div class="editorial-line p-4 border border-archive-craft text-xs text-archive-dark font-serif leading-[30px] mb-4">
            <p id="modal-poetic-story">—</p>
        </div>

        <div class="bg-archive-craft/20 p-3 text-xs text-archive-muted font-serif space-y-1 mb-5">
            <div><strong class="font-mono text-[10px] text-archive-dark uppercase block">QUOTED TEXT</strong> <span id="modal-quote">—</span></div>
            <div class="pt-1"><strong class="font-mono text-[10px] text-archive-dark uppercase block">KEYWORDS</strong> <span id="modal-tags">—</span></div>
        </div>

        <div class="flex justify-between items-center font-mono text-xs">
            <button onclick="likeModalItem()" class="px-3.5 py-1.5 border border-archive-craft hover:bg-archive-craft/30 text-archive-dark transition-colors flex items-center space-x-1.5">
                <i class="fa-regular fa-heart text-archive-terracotta"></i>
                <span id="modal-like-count">SAVED 0</span>
            </button>
            <button onclick="closeModal()" class="px-4 py-1.5 bg-archive-dark text-archive-paper">CLOSE</button>
        </div>
    </div>
</div>

<script>
(function() {
    const items = (window.PAGE_DATA || {}).items || [];

    function render(filter) {
        const grid = document.getElementById('archive-grid');
        grid.innerHTML = '';
        const filtered = filter === 'all' ? items : items.filter(i => i.persona === filter);

        if (filtered.length === 0) {
            grid.innerHTML = '<p class="col-span-3 text-center text-archive-craft font-serif text-sm py-10">아직 서가가 비어 있습니다.</p>';
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'torn-paper p-4 relative cursor-pointer hover:shadow-xl transition-all flex flex-col justify-between';
            card.onclick = () => openModal(item);
            card.innerHTML = `
                <div class="tape-strip w-16 -top-2 left-4 rotate-[-1deg]"></div>
                <div>
                    <div class="flex justify-between items-center mb-3 pt-1 font-mono text-[9px]">
                        <span class="px-2 py-0.5 bg-archive-dark text-archive-paper font-bold uppercase">${item.persona || ''}</span>
                        <span class="text-archive-muted">${item.date || item.dateRaw || ''}</span>
                    </div>
                    <div class="contact-sheet p-1.5 mb-3">
                        <img src="${(item.photos && item.photos[0]) || ''}" class="w-full h-32 object-cover">
                    </div>
                    <p class="text-xs font-serif text-archive-dark italic mb-3" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">"${item.quote || ''}"</p>
                </div>
                <div class="pt-2 border-t border-archive-craft/60 flex justify-between items-center font-mono text-[9px] text-archive-muted">
                    <span>${(item.tags && item.tags[0]) || '#취향기록'}</span>
                    <span class="flex items-center space-x-1"><i class="fa-solid fa-heart text-archive-terracotta"></i> <span>${item.likes || 0}</span></span>
                </div>`;
            grid.appendChild(card);
        });
    }

    window.filterArchive = function(persona, event) {
        document.querySelectorAll('.archive-filter-btn').forEach(btn => {
            btn.className = 'archive-filter-btn px-3 py-1 border border-archive-craft/40 text-archive-craft hover:text-white font-mono text-xs';
        });
        if (event && event.target) {
            event.target.className = 'archive-filter-btn px-3 py-1 bg-archive-paper text-archive-dark font-bold font-mono text-xs';
        }
        render(persona);
    };

    let currentModalItem = null;
    window.openModal = function(item) {
        currentModalItem = item;
        document.getElementById('modal-badge').innerText = (item.persona || '').toUpperCase() + ' ASPECT';
        document.getElementById('modal-date').innerText = item.date || item.dateRaw || '';
        document.getElementById('modal-img').src = (item.photos && item.photos[0]) || '';
        document.getElementById('modal-poetic-story').innerText = item.poetic_story || item.poeticStory || '';
        document.getElementById('modal-quote').innerText = '"' + (item.quote || '') + '"';
        document.getElementById('modal-tags').innerText = (item.tags || []).join(' ');
        document.getElementById('modal-like-count').innerText = 'SAVED ' + (item.likes || 0);
        document.getElementById('archive-modal').classList.remove('hidden');
    };
    window.closeModal = function() {
        document.getElementById('archive-modal').classList.add('hidden');
    };
    window.likeModalItem = function() {
        if (!currentModalItem) return;
        currentModalItem.likes = (currentModalItem.likes || 0) + 1;
        document.getElementById('modal-like-count').innerText = 'SAVED ' + currentModalItem.likes;
        render('all');
    };

    render('all');
})();
</script>
