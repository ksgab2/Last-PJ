<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>liaollet : 감정 다락방 속 취향 아카이브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        archive: {
                            bg: '#EAE5DC', paper: '#F5F2EC', craft: '#D3C9B8',
                            dark: '#2A2825', muted: '#6E675F',
                            terracotta: '#9B4028', accent: '#4B5340'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif KR"', 'serif'],
                        display: ['"Playfair Display"', 'serif'],
                        mono: ['"Space Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #2A2825;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(211, 201, 184, 0.08) 0%, transparent 75%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px;
            color: #2A2825;
            font-family: 'Noto Serif KR', serif;
            word-break: keep-all;
        }
        .torn-paper { background-color: #F5F2EC; box-shadow: 0 20px 40px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.2); position: relative; }
        .torn-edge-top-bottom {
            clip-path: polygon(
                0% 0.8%, 4% 0%, 9% 0.6%, 15% 0.1%, 21% 0.7%, 27% 0%, 33% 0.5%, 39% 0.1%, 45% 0.8%, 51% 0%, 57% 0.6%, 63% 0.1%, 69% 0.7%, 75% 0%, 81% 0.5%, 87% 0.1%, 93% 0.8%, 100% 0.2%,
                100% 99.2%, 96% 100%, 91% 99.4%, 85% 99.9%, 79% 99.3%, 73% 100%, 67% 99.5%, 61% 100%, 55% 99.2%, 49% 99.8%, 43% 99.3%, 37% 100%, 31% 99.4%, 25% 100%, 19% 99.2%, 13% 99.8%, 7% 99.3%, 0% 99.8%
            );
        }
        .silkscreen-stamp { border: 1px solid #9B4028; color: #9B4028; letter-spacing: 0.15em; font-family: 'Space Mono', monospace; }
        .contact-sheet { background-color: #1C1A18; border: 1px solid #3A3632; }
        .editorial-line { background-image: repeating-linear-gradient(transparent, transparent 31px, #D3C9B8 32px); line-height: 32px; }
        .tape-strip {
            position: absolute; height: 18px;
            background-color: rgba(211, 201, 184, 0.65);
            backdrop-filter: blur(2px);
            border-left: 1px solid rgba(110, 103, 95, 0.3);
            border-right: 1px solid rgba(110, 103, 95, 0.3);
            z-index: 20;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #2A2825; }
        ::-webkit-scrollbar-thumb { background: #6E675F; border-radius: 2px; }
    </style>
    <script>window.PAGE_DATA = window.PAGE_DATA || {};</script>
</head>
